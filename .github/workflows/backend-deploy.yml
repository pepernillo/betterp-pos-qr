name: Backend Release Verification

on:
  workflow_dispatch:
    inputs:
      deploy_commit:
        description: "Commit completo ya desplegado mediante el release de Vultr"
        required: true
      wait_seconds:
        description: "Segundos para esperar a que Vultr publique el contrato backend"
        required: false
        default: "300"
      require_report_publish:
        description: "Fallar si no se publica evidencia smoke en backoffice"
        required: false
        type: boolean
        default: true

concurrency:
  group: backend-release-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTERP_DEPLOY_COMMIT: ${{ inputs.deploy_commit }}
      BETTERP_DEPLOY_WAIT_SECONDS: ${{ inputs.wait_seconds }}
      BETTERP_SMOKE_REQUIRE_DEPLOY_COMMIT: "1"
      BETTERP_SMOKE_EMAIL: ${{ secrets.BETTERP_SMOKE_EMAIL }}
      BETTERP_SMOKE_PASSWORD: ${{ secrets.BETTERP_SMOKE_PASSWORD }}
      BETTERP_SMOKE_CAPA_ID: ${{ secrets.BETTERP_SMOKE_CAPA_ID }}
      BETTERP_SMOKE_PORTAL_TOKEN: ${{ secrets.BETTERP_SMOKE_PORTAL_TOKEN }}
      BETTERP_SMOKE_REPORT_JSON: backend-release-smoke-report.json
      BETTERP_SMOKE_REPORT_TOKEN: ${{ secrets.BETTERP_SMOKE_REPORT_TOKEN }}
      BETTERP_SMOKE_REPORT_REQUIRED: ${{ inputs.require_report_publish && '1' || '0' }}
      BETTERP_SMOKE_SOURCE: backend_release_verification
    steps:
      - name: Validate commit input
        shell: bash
        run: |
          [[ "$BETTERP_DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::deploy_commit debe ser un SHA completo de 40 caracteres"
            exit 1
          }

      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_commit }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Vultr backend contract
        run: python scripts/wait_backend_contract.py

      - name: Run production smoke
        run: python scripts/smoke_mvp.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-smoke-report
          path: backend-release-smoke-report.json
          if-no-files-found: ignore
