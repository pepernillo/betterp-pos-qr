name: Production Smoke

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Segundos para esperar a que Vultr publique el contrato backend"
        required: false
        default: "600"
      require_deploy_commit:
        description: "Fallar si health no expone el commit servido"
        required: false
        type: boolean
        default: true
      require_report_publish:
        description: "Fallar si no se publica evidencia smoke en backoffice"
        required: false
        type: boolean
        default: true
      enable_write:
        description: "Ejecutar escritura reversible contra la capa smoke permitida"
        required: false
        type: boolean
        default: false
      enable_e2e:
        description: "Ejecutar QA E2E reversible de cliente/portal"
        required: false
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BETTERP_SMOKE_EMAIL: ${{ secrets.BETTERP_SMOKE_EMAIL }}
      BETTERP_SMOKE_PASSWORD: ${{ secrets.BETTERP_SMOKE_PASSWORD }}
      BETTERP_SMOKE_CAPA_ID: ${{ secrets.BETTERP_SMOKE_CAPA_ID }}
      BETTERP_SMOKE_PORTAL_TOKEN: ${{ secrets.BETTERP_SMOKE_PORTAL_TOKEN }}
      BETTERP_SMOKE_WRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_write && '1' || '0' }}
      BETTERP_SMOKE_WRITE_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_write && 'SMOKE_WRITE_OK' || '' }}
      BETTERP_SMOKE_WRITE_ALLOWED_CAPA_ID: ${{ secrets.BETTERP_SMOKE_WRITE_ALLOWED_CAPA_ID }}
      BETTERP_SMOKE_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_e2e && '1' || '0' }}
      BETTERP_SMOKE_REPORT_JSON: smoke-report.json
      BETTERP_SMOKE_REPORT_TOKEN: ${{ secrets.BETTERP_SMOKE_REPORT_TOKEN }}
      BETTERP_SMOKE_REPORT_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_report_publish && '1' || '0' }}
      BETTERP_SMOKE_SOURCE: production_smoke
      BETTERP_DEPLOY_COMMIT: ${{ github.sha }}
      BETTERP_DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_seconds || '60' }}
      BETTERP_SMOKE_REQUIRE_DEPLOY_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_deploy_commit && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for backend deploy contract
        run: python scripts/wait_backend_contract.py

      - name: Run production smoke
        run: python scripts/smoke_mvp.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: smoke-report.json
          if-no-files-found: ignore
