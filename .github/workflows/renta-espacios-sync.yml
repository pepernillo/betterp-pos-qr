name: Sincronizar renta de espacios

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar sincronizacion programada
        env:
          SYNC_TOKEN: ${{ secrets.RENTA_ESPACIOS_SYNC_TOKEN }}
          SYNC_URL: ${{ secrets.RENTA_ESPACIOS_SYNC_URL }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "RENTA_ESPACIOS_SYNC_TOKEN no esta configurado; se omite la sincronizacion."
            exit 0
          fi

          if [ -z "$SYNC_URL" ]; then
            SYNC_URL="https://api.betterp.net/api/renta-espacios/sincronizacion-programada/"
          fi

          echo "Llamando sincronizacion programada en $SYNC_URL"
          response_file="$(mktemp)"
          curl_exit=0
          http_code=$(curl --show-error --silent \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST "$SYNC_URL" \
            --header "X-BetterP-Sync-Token: $SYNC_TOKEN" \
            --header "Authorization: Bearer $SYNC_TOKEN") || curl_exit=$?

          echo "HTTP $http_code"
          cat "$response_file"
          echo

          if [ "$curl_exit" -ne 0 ]; then
            echo "La llamada de sincronizacion fallo con salida curl $curl_exit."
            exit "$curl_exit"
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "La sincronizacion programada fallo con HTTP $http_code."
            exit 1
          fi
