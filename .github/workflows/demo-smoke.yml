name: Demo Smoke

on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      require_report_publish:
        description: "Fallar si no se publica evidencia smoke en backoffice"
        required: false
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BETTERP_API_BASE: ${{ secrets.BETTERP_DEMO_API_BASE }}
      BETTERP_APP_BASE: ${{ secrets.BETTERP_DEMO_APP_BASE }}
      BETTERP_HEALTH_URL: ${{ secrets.BETTERP_DEMO_HEALTH_URL }}
      BETTERP_SMOKE_EMAIL: ${{ secrets.BETTERP_DEMO_SMOKE_EMAIL }}
      BETTERP_SMOKE_PASSWORD: ${{ secrets.BETTERP_DEMO_SMOKE_PASSWORD }}
      BETTERP_SMOKE_CAPA_ID: ${{ secrets.BETTERP_DEMO_SMOKE_CAPA_ID }}
      BETTERP_SMOKE_REPORT_JSON: demo-smoke-report.json
      BETTERP_SMOKE_REPORT_TOKEN: ${{ secrets.BETTERP_SMOKE_REPORT_TOKEN }}
      BETTERP_SMOKE_REPORT_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_report_publish && '1' || '0' }}
      BETTERP_SMOKE_SOURCE: demo_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run demo smoke
        run: python scripts/smoke_mvp.py

      - name: Upload demo smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-report
          path: demo-smoke-report.json
          if-no-files-found: ignore
