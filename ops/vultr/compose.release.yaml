services:
  betterp-api:
    image: ${BETTERP_IMAGE:?BETTERP_IMAGE is required}
    environment: &betterp-release-environment
      BETTERP_GIT_COMMIT: ${BETTERP_COMMIT:?BETTERP_COMMIT is required}
      BETTERP_DEPLOY_ID: ${BETTERP_DEPLOY_ID:?BETTERP_DEPLOY_ID is required}
      BETTERP_PLATFORM: vultr
      BETTERP_RUNTIME: docker
      BETTERP_LOG_BACKEND: docker-json-file
      BETTERP_LOG_LOCATION: docker compose logs betterp-api
  betterp-prepare:
    image: ${BETTERP_IMAGE:?BETTERP_IMAGE is required}
    environment: *betterp-release-environment
  betterp-scheduler:
    image: ${BETTERP_IMAGE:?BETTERP_IMAGE is required}
    environment: *betterp-release-environment
  betterp-background-worker:
    image: ${BETTERP_IMAGE:?BETTERP_IMAGE is required}
    environment: *betterp-release-environment

  vendefacil-api:
    image: ${VENDEFACIL_IMAGE:?VENDEFACIL_IMAGE is required}
  vendefacil-prepare:
    image: ${VENDEFACIL_IMAGE:?VENDEFACIL_IMAGE is required}

  tienda-facil-api:
    image: ${TIENDA_FACIL_IMAGE:?TIENDA_FACIL_IMAGE is required}
  tienda-facil-prepare:
    image: ${TIENDA_FACIL_IMAGE:?TIENDA_FACIL_IMAGE is required}
  tienda-facil-marketplace-worker:
    image: ${TIENDA_FACIL_IMAGE:?TIENDA_FACIL_IMAGE is required}
  tienda-facil-marketplace-outbox-worker:
    image: ${TIENDA_FACIL_IMAGE:?TIENDA_FACIL_IMAGE is required}
  tienda-facil-marketplace-webhook-worker:
    image: ${TIENDA_FACIL_IMAGE:?TIENDA_FACIL_IMAGE is required}
